[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plane-point-picker"
version = "0.1.0"
description = "AprilTag plane calibration and manual shot localization"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "opencv-python>=4.8", "PySide6>=6.6", "PyYAML>=6.0", "pupil-apriltags>=1.0.4.post11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
plane-picker = "plane_picker.app:main"
validate-mapping = "plane_picker.validation_cli:main"
plane-trajectory = "plane_picker.trajectory_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
